name: Build APK<br/><br/>on:<br/>  push:<br/>    branches: [ main, master ]<br/>  workflow_dispatch:<br/><br/>jobs:<br/>  build:<br/>    runs-on: ubuntu-latest<br/>    steps:<br/>      - uses: actions/checkout@v4<br/><br/>      - name: Set up JDK 17<br/>        uses: actions/setup-java@v4<br/>        with:<br/>          java-version: '17'<br/>          distribution: 'temurin'<br/><br/>      - name: Setup Gradle<br/>        uses: gradle/actions/setup-gradle@v4<br/><br/>      - name: Set up Android SDK<br/>        uses: android-actions/setup-android@v3<br/><br/>      - name: Accept SDK licenses<br/>        run: yes | sdkmanager --licenses || true<br/><br/>      - name: Install SDK components<br/>        run: |<br/>          sdkmanager "platforms;android-34" "build-tools;34.0.0"<br/><br/>      - name: Build Debug APK<br/>        run: gradle assembleDebug --no-daemon<br/><br/>      - name: Upload APK artifact<br/>        uses: actions/upload-artifact@v4<br/>        with:<br/>          name: AutoClicker-Pro<br/>          path: app/build/outputs/apk/debug/app-debug.apk
